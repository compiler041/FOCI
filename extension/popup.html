<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foci</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:      #07070f;
      --surface: #0e0e1c;
      --card:    #12121e;
      --border:  #1e1e30;
      --purple:  #7c6af7;
      --purple-glow: rgba(124,106,247,0.25);
      --teal:    #22d3ee;
      --text:    #ffffff;
      --text-sub:#9ca3af;
      --text-muted: #4b5563;
      --green:   #22c55e;
      --red:     #ef4444;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ────────────────────────────── */
    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-orb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 55% at 38% 35%, #c084fc 0%, #7c6af7 35%, #4361ee 70%, #050520 100%);
      box-shadow: 0 0 10px rgba(124,106,247,0.6), 0 0 20px rgba(124,106,247,0.2);
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
    }

    .status-pill.inactive {
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.2);
      color: var(--red);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .status-pill.inactive .status-dot {
      background: var(--red);
      animation: none;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── NOT LOGGED IN ──────────────────────── */
    #state-logged-out {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      gap: 20px;
      text-align: center;
    }

    .login-orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 55% at 38% 35%, #c084fc 0%, #7c6af7 35%, #4361ee 70%, #050520 100%);
      box-shadow: 0 0 30px rgba(124,106,247,0.5), 0 0 60px rgba(124,106,247,0.2);
      animation: float 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .login-orb::after {
      content: '';
      position: absolute;
      width: 35%;
      height: 25%;
      top: 14%;
      left: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.4) 0%, transparent 100%);
      transform: rotate(-20deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .login-title { font-size: 18px; font-weight: 800; }
    .login-sub { font-size: 13px; color: var(--text-sub); line-height: 1.5; }

    /* ── LOGGED IN ──────────────────────────── */
    #state-logged-in { display: none; flex-direction: column; }

    /* Mini orb strip */
    .orb-strip {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .mini-orb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 55% at 38% 35%, #c084fc 0%, #7c6af7 35%, #4361ee 70%, #050520 100%);
      box-shadow: 0 0 20px rgba(124,106,247,0.5), 0 0 40px rgba(124,106,247,0.15);
      position: relative;
      overflow: hidden;
      animation: float 4s ease-in-out infinite;
      flex-shrink: 0;
    }

    .mini-orb::after {
      content: '';
      position: absolute;
      width: 35%;
      height: 25%;
      top: 14%;
      left: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.4) 0%, transparent 100%);
      transform: rotate(-20deg);
    }

    .orb-info { flex: 1; }
    .orb-score { font-size: 26px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .orb-label { font-size: 12px; color: var(--text-sub); margin-top: 3px; font-weight: 500; }

    /* Session indicator */
    .session-bar {
      margin: 0 16px 0;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .session-left { display: flex; align-items: center; gap: 8px; }

    .session-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    .session-pulse.idle { background: var(--text-muted); box-shadow: none; animation: none; }

    .session-label { font-size: 13px; font-weight: 600; }
    .session-time { font-size: 15px; font-weight: 800; color: var(--green); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }

    /* Section */
    .section { padding: 0 16px 16px; }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }

    /* Toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .toggle-label { font-size: 14px; font-weight: 600; }
    .toggle-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .toggle {
      position: relative;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 26px;
      cursor: pointer;
      transition: background 0.25s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 4px;
      top: 4px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .toggle input:checked + .toggle-slider { background: var(--purple); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* App list */
    .app-list { display: flex; flex-direction: column; gap: 6px; }

    .app-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .app-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }

    .app-name { font-size: 13px; font-weight: 600; flex: 1; }
    .app-url { font-size: 11px; color: var(--text-muted); }

    .app-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(239,68,68,0.12);
      color: var(--red);
    }

    /* Empty */
    .empty-text { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: var(--purple);
      color: white;
      box-shadow: 0 3px 16px var(--purple-glow);
    }

    .btn-primary:hover { background: #6b5ae8; }

    .btn-ghost {
      background: var(--surface);
      color: var(--text-sub);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .btn-ghost:hover { border-color: var(--purple); color: var(--text); }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Footer */
    .footer {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sync-row {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-orb"></div>
      <span class="logo-text">Foci</span>
    </div>
    <div class="header-right">
      <div class="status-pill" id="statusPill">
        <div class="status-dot"></div>
        <span id="statusText">Active</span>
      </div>
    </div>
  </div>

  <!-- NOT LOGGED IN -->
  <div id="state-logged-out">
    <div class="login-orb"></div>
    <div>
      <h2 class="login-title">Not Connected</h2>
      <p class="login-sub">Sign in to Foci to start blocking distractions</p>
    </div>
    <a href="http://localhost:5173/login" target="_blank" id="open-login-btn" class="btn btn-primary" style="text-decoration:none; margin: 0 0; width: auto; padding: 12px 28px;">
      Open Foci
    </a>
  </div>

  <!-- LOGGED IN -->
  <div id="state-logged-in">

    <!-- Mini orb + score -->
    <div class="orb-strip">
      <div class="mini-orb"></div>
      <div class="orb-info">
        <div class="orb-score" id="focusScore">—</div>
        <div class="orb-label" id="focusLabel">Calculating...</div>
      </div>
    </div>

    <!-- Session status -->
    <div style="padding: 12px 16px 0;">
      <div class="session-bar" id="sessionBar">
        <div class="session-left">
          <div class="session-pulse idle" id="sessionPulse"></div>
          <div>
            <div class="session-label" id="sessionLabel">No active session</div>
          </div>
        </div>
        <div class="session-time" id="sessionTime"></div>
      </div>
    </div>

    <!-- Blocking toggle -->
    <div class="section">
      <p class="section-label">Protection</p>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Block Distractions</div>
          <div class="toggle-sub" id="toggleSub">Protecting you now</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="blockToggle" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Blocked apps -->
    <div class="section">
      <p class="section-label">Blocked Sites</p>
      <div class="app-list" id="appList">
        <div class="empty-text">Loading...</div>
      </div>
    </div>

    <!-- Footer buttons -->
    <div class="footer">
      <a href="http://localhost:5173" target="_blank" id="open-dashboard-btn" class="btn btn-primary" style="text-decoration:none;">
        🏠 Open Dashboard
      </a>
      <button class="btn btn-ghost" id="syncBtn">⟳ Sync Rules</button>
      <div class="sync-row" id="syncStatus">Last synced just now</div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
